- name: Start DMC runners
  hosts: all
  gather_facts: yes
  vars:
    project_dir: "{{ ansible_env.HOME }}/dmc-dmc_refactored"

  tasks:
    - name: Start runner (reliable)
      shell: |
       cd {{ project_dir }}
       nohup python3 -u runner.py > runner.log 2>&1 &
      args:
        executable: /bin/bash

- name: Wait for runners to be ready
  hosts: localhost
  tasks:
    - pause:
        seconds: 4

- name: Send training config
  hosts: all
  gather_facts: no
  vars:
    project_dir: "{{ ansible_env.HOME }}/dmc-dmc_refactored"
    config_path: "{{ project_dir }}/config.json"

  tasks:
    - name: Write config file
      copy:
        dest: "{{ config_path }}"
        content: |
          {
            "nnodes": {{ groups['all'] | length }},
            "rank": {{ groups['all'].index(inventory_hostname) }},
            "master_addr": "{{ hostvars[groups['master'][0]].ansible_host }}",
            "script": "multinode_demo.py"
          }

    - name: Send config to runner
      shell: python3 send_config.py {{ ansible_host }} {{ config_path }}
      args:
        chdir: "{{ project_dir }}"