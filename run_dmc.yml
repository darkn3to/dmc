- name: Run DMC training
  hosts: all
  gather_facts: yes
  vars:
    project_dir: "{{ ansible_env.HOME }}/dmc"

  tasks:
    - name: Launch distributed training
      shell: |
        PYTHONUNBUFFERED=1 \
        python3 -u -m torch.distributed.run \
          --nnodes={{ groups['all'] | length }} \
          --nproc_per_node=1 \
          --node_rank={{ groups['all'].index(inventory_hostname) }} \
          --master_addr={{ hostvars[groups['master'][0]].ansible_host }} \
          --master_port=29500 \
          test2.py

      args:
        chdir: "{{ project_dir }}"
